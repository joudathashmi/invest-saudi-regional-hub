# Netlify: static export of the Next.js page (npm run preview -> out/)
[build]
  command = "npm run preview"
  publish = "out"

[[headers]]
  for = "/_blob/*"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/"
  to = "/why-saudi/regional-hub/"
  status = 302
